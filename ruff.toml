# Pin the lint ruleset explicitly so CI is reproducible across ruff versions. CI installs ruff
# unpinned (pip install ruff); ruff 0.16 expanded its DEFAULT rule set (isort/SIM/UP/pyupgrade/
# flake8-executable/…), which silently turned a green repo red on an upgrade. Selecting the classic
# default categories keeps the gate stable and identical to the pinned dev .venv, independent of the
# installed ruff version. Opting into the newer rule families is a separate, deliberate cleanup.
target-version = "py312"

[lint]
select = ["E4", "E7", "E9", "F"]
